name: Deploy Literkowo to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "pwa/**"
      - "scripts/**"
      - ".github/workflows/deploy-pages.yml"
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true
      - name: Set up Python for Polish speech generation
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Restore Polish voice and audio cache
        id: audio-cache
        uses: actions/cache@v6
        with:
          path: |
            .voice
            pwa/audio
          key: literkowo-audio-v1-${{ runner.os }}-${{ hashFiles('scripts/generate_literkowo_audio.py','pwa/app.js','pwa/letter-paths.json','pwa/letter-points.json') }}
          restore-keys: |
            literkowo-audio-v1-${{ runner.os }}-
      - name: Install audio generation tools
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: |
          if ! command -v ffmpeg >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y ffmpeg
          fi
          python -m pip install --upgrade pip
          python -c "import piper" >/dev/null 2>&1 || python -m pip install piper-tts
      - name: Download Polish neural voice
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: |
          if [ ! -s "./.voice/pl_PL-gosia-medium.onnx" ]; then
            python -m piper.download_voices pl_PL-gosia-medium --data-dir ./.voice
          fi
      - name: Generate offline Polish audio clips
        if: steps.audio-cache.outputs.cache-hit != 'true'
        run: |
          python scripts/generate_literkowo_audio.py \
            --model ./.voice/pl_PL-gosia-medium.onnx \
            --output ./pwa/audio
      - name: Upload PWA
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./pwa
      - name: Wait for GitHub Pages artifact to become available
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for attempt in $(seq 1 12); do
            artifact_id=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" --jq '.artifacts[] | select(.name == "github-pages" and .expired == false) | .id' | head -n 1)
            if [ -n "$artifact_id" ]; then
              echo "GitHub Pages artifact is visible: $artifact_id"
              exit 0
            fi
            echo "Artifact metadata not visible yet (attempt $attempt/12). Retrying in 5 seconds..."
            sleep 5
          done
          echo "GitHub Pages artifact did not become visible through the Actions API." >&2
          exit 1
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
