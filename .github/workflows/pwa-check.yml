name: Kontrola PWA

'on':
  push:
    branches:
      - main
      - feature/literkowo-pwa
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pwa-check:
    name: Testy statyczne PWA
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Pobierz kod
        uses: actions/checkout@v4

      - name: Skonfiguruj Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sprawdź składnię JavaScript
        run: node --check pwa/app.js

      - name: Sprawdź poprawność manifestu
        run: node -e "const fs=require('fs'); const m=JSON.parse(fs.readFileSync('pwa/manifest.webmanifest','utf8')); if(!m.name || !m.start_url || !m.display) process.exit(1); console.log('Manifest PWA: OK')"

      - name: Sprawdź kompletność plików
        run: |
          set -eu
          test -s pwa/index.html
          test -s pwa/styles.css
          test -s pwa/app.js
          test -s pwa/sw.js
          test -s pwa/manifest.webmanifest
          test -s pwa/icon.svg
          echo "Pliki PWA: OK"
