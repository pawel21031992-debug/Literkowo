name: Deploy Literkowo Supabase API

on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/deploy-supabase.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Configure function secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
          RATE_LIMIT_SECRET: ${{ secrets.RATE_LIMIT_SECRET }}
        run: |
          test -n "$SUPABASE_ACCESS_TOKEN" || (echo "Missing SUPABASE_ACCESS_TOKEN" && exit 1)
          test -n "$SUPABASE_PROJECT_REF" || (echo "Missing SUPABASE_PROJECT_REF" && exit 1)
          test -n "$RATE_LIMIT_SECRET" || (echo "Missing RATE_LIMIT_SECRET" && exit 1)
          printf 'RATE_LIMIT_SECRET=%s\nALLOWED_ORIGIN=https://pawel21031992-debug.github.io\n' "$RATE_LIMIT_SECRET" > .env.supabase
          supabase secrets set --env-file .env.supabase --project-ref "$SUPABASE_PROJECT_REF"
          rm -f .env.supabase
      - name: Deploy account API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ vars.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy literkowo-api --project-ref "$SUPABASE_PROJECT_REF" --no-verify-jwt
